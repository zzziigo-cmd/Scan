
name: Scan - Android CI

on:
  push:
    branches:
      - main
      - "fixes/**"
      - "feature/**"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scan-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Vérification et compilation Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vérifier les fichiers Gradle
        run: |
          test -f gradlew
          test -f settings.gradle.kts
          test -f app/build.gradle.kts

      - name: Autoriser Gradle Wrapper
        run: chmod +x gradlew

      - name: Vérifier la compilation
        run: ./gradlew :app:assembleDebug

      - name: Exécuter les tests unitaires
        run: ./gradlew :app:testDebugUnitTest

      - name: Générer le rapport de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Archiver APK Debug
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Scan-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
